<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#07090e; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1280" height="720" fill="#07090e"/>
  <rect x="0" y="0" width="1280" height="48" fill="#0c101a" stroke="#1e2638" stroke-width="1"/>
  <text x="20" y="30" fill="#ffffff" font-weight="700" font-size="14" letter-spacing="1.5">FABRICLAB</text>
  <text x="120" y="30" fill="#64748b" font-size="11">| Performance Benchmark Suite</text>

  <g transform="translate(60, 80)">
    <text x="0" y="20" fill="#f8fafc" font-size="22" font-weight="700">XPBD Compute Benchmark Laboratory</text>
    <text x="0" y="44" fill="#94a3b8" font-size="12">Multi-tier resolution scaling stress tests measuring sub-step frame latency, throughput, and WebGPU compute scaling.</text>
  </g>

  <!-- Benchmark Tiers Table -->
  <g transform="translate(60, 160)">
    <rect width="1160" height="320" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="1160" height="44" rx="8" fill="#111827"/>
    <g transform="translate(24, 28)" font-size="11" font-weight="700" fill="#94a3b8">
      <text x="0" y="0">Resolution Tier</text>
      <text x="180" y="0">Grid</text>
      <text x="300" y="0">Particles</text>
      <text x="440" y="0">Triangles</text>
      <text x="580" y="0">Mean FPS</text>
      <text x="720" y="0">Mean Latency</text>
      <text x="860" y="0">P99 Latency</text>
      <text x="1020" y="0">Action</text>
    </g>

    <!-- Row 1: 5K -->
    <g transform="translate(24, 82)" font-size="12">
      <text x="0" y="0" fill="#ffffff" font-weight="700">5K (Standard)</text>
      <text x="180" y="0" fill="#64748b">50x50</text>
      <text x="300" y="0" fill="#cbd5e1">2,601</text>
      <text x="440" y="0" fill="#cbd5e1">5,000</text>
      <text x="580" y="0" fill="#10b981" font-weight="700">107 FPS</text>
      <text x="720" y="0" fill="#38bdf8">9.31 ms</text>
      <text x="860" y="0" fill="#94a3b8">11.45 ms</text>
      <rect x="1000" y="-14" width="80" height="24" rx="4" fill="#0284c7"/>
      <text x="1022" y="2" fill="#ffffff" font-size="10" font-weight="700">Run Tier</text>
    </g>
    <line x1="20" y1="104" x2="1140" y2="104" stroke="#1e293b"/>

    <!-- Row 2: 10K -->
    <g transform="translate(24, 136)" font-size="12">
      <text x="0" y="0" fill="#ffffff" font-weight="700">10K (Dense)</text>
      <text x="180" y="0" fill="#64748b">70x70</text>
      <text x="300" y="0" fill="#cbd5e1">5,041</text>
      <text x="440" y="0" fill="#cbd5e1">9,800</text>
      <text x="580" y="0" fill="#10b981" font-weight="700">84 FPS</text>
      <text x="720" y="0" fill="#38bdf8">11.90 ms</text>
      <text x="860" y="0" fill="#94a3b8">14.20 ms</text>
      <rect x="1000" y="-14" width="80" height="24" rx="4" fill="#1e293b"/>
      <text x="1022" y="2" fill="#94a3b8" font-size="10">Run Tier</text>
    </g>
    <line x1="20" y1="158" x2="1140" y2="158" stroke="#1e293b"/>

    <!-- Row 3: 25K -->
    <g transform="translate(24, 190)" font-size="12">
      <text x="0" y="0" fill="#ffffff" font-weight="700">25K (High Fidelity)</text>
      <text x="180" y="0" fill="#64748b">110x110</text>
      <text x="300" y="0" fill="#cbd5e1">12,321</text>
      <text x="440" y="0" fill="#cbd5e1">24,200</text>
      <text x="580" y="0" fill="#10b981" font-weight="700">42 FPS</text>
      <text x="720" y="0" fill="#38bdf8">23.80 ms</text>
      <text x="860" y="0" fill="#94a3b8">28.50 ms</text>
      <rect x="1000" y="-14" width="80" height="24" rx="4" fill="#1e293b"/>
      <text x="1022" y="2" fill="#94a3b8" font-size="10">Run Tier</text>
    </g>
    <line x1="20" y1="212" x2="1140" y2="212" stroke="#1e293b"/>

    <!-- Row 4: 50K -->
    <g transform="translate(24, 244)" font-size="12">
      <text x="0" y="0" fill="#ffffff" font-weight="700">50K (Extreme)</text>
      <text x="180" y="0" fill="#64748b">160x160</text>
      <text x="300" y="0" fill="#cbd5e1">25,921</text>
      <text x="440" y="0" fill="#cbd5e1">51,200</text>
      <text x="580" y="0" fill="#94a3b8">-</text>
      <text x="720" y="0" fill="#94a3b8">-</text>
      <text x="860" y="0" fill="#94a3b8">-</text>
      <rect x="1000" y="-14" width="80" height="24" rx="4" fill="#1e293b"/>
      <text x="1022" y="2" fill="#94a3b8" font-size="10">Run Tier</text>
    </g>
    <line x1="20" y1="266" x2="1140" y2="266" stroke="#1e293b"/>

    <!-- Row 5: 100K -->
    <g transform="translate(24, 298)" font-size="12">
      <text x="0" y="0" fill="#ffffff" font-weight="700">100K (Stress Lab)</text>
      <text x="180" y="0" fill="#64748b">225x225</text>
      <text x="300" y="0" fill="#cbd5e1">51,076</text>
      <text x="440" y="0" fill="#cbd5e1">101,250</text>
      <text x="580" y="0" fill="#94a3b8">-</text>
      <text x="720" y="0" fill="#94a3b8">-</text>
      <text x="860" y="0" fill="#94a3b8">-</text>
      <rect x="1000" y="-14" width="80" height="24" rx="4" fill="#1e293b"/>
      <text x="1022" y="2" fill="#94a3b8" font-size="10">Run Tier</text>
    </g>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(60, 520)">
    <rect width="1160" height="80" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="36" fill="#ffffff" font-size="14" font-weight="700">Export Benchmark Data</text>
    <text x="24" y="56" fill="#64748b" font-size="11">Download execution history containing exact frame deltas and hardware specifications as CSV.</text>
    <rect x="1000" y="24" width="130" height="34" rx="4" fill="#10b981"/>
    <text x="1024" y="45" fill="#ffffff" font-size="11" font-weight="700">📥 Export CSV</text>
  </g>
</svg>