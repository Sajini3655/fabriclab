<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#07090e; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1280" height="720" fill="#07090e"/>
  <rect x="0" y="0" width="1280" height="48" fill="#0c101a" stroke="#1e2638" stroke-width="1"/>
  <text x="20" y="30" fill="#ffffff" font-weight="700" font-size="14" letter-spacing="1.5">FABRICLAB</text>
  <text x="120" y="30" fill="#64748b" font-size="11">| Material Physics Comparison</text>

  <g transform="translate(60, 80)">
    <text x="0" y="20" fill="#f8fafc" font-size="22" font-weight="700">Material Physics Comparison Laboratory</text>
    <text x="0" y="44" fill="#94a3b8" font-size="12">Side-by-side analytical comparative matrix of textile dynamics, compliance, and mass density.</text>
  </g>

  <!-- Side by Side Comparative Panes -->
  <g transform="translate(60, 160)">
    <!-- Specimen A: Mulberry Silk -->
    <g transform="translate(0, 0)">
      <rect width="560" height="480" rx="8" fill="#0d131f" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="28" y="42" fill="#38bdf8" font-size="18" font-weight="700">Specimen A: Mulberry Silk</text>
      <text x="28" y="70" fill="#94a3b8" font-size="12">Natural protein filament with ultra-low area mass and fluid drape.</text>
      <line x1="28" y1="95" x2="532" y2="95" stroke="#1e293b"/>
      
      <g transform="translate(28, 120)" font-size="12">
        <text x="0" y="20" fill="#64748b">Category</text>
        <text x="350" y="20" fill="#38bdf8" font-weight="700">Natural Filament</text>

        <text x="0" y="60" fill="#64748b">Area Density (Mass)</text>
        <text x="350" y="60" fill="#f8fafc" font-weight="700">0.065 kg/m²</text>

        <text x="0" y="100" fill="#64748b">Stretch Compliance (α)</text>
        <text x="350" y="100" fill="#f8fafc" font-weight="700">0.0001 m/N</text>

        <text x="0" y="140" fill="#64748b">Bending Compliance (α_bend)</text>
        <text x="350" y="140" fill="#f8fafc" font-weight="700">0.015 rad/N</text>

        <text x="0" y="180" fill="#64748b">Internal Damping</text>
        <text x="350" y="180" fill="#f8fafc" font-weight="700">0.012</text>

        <text x="0" y="220" fill="#64748b">Surface Friction</text>
        <text x="350" y="220" fill="#f8fafc" font-weight="700">0.15</text>

        <text x="0" y="260" fill="#64748b">Bending Rigidity Rating</text>
        <text x="350" y="260" fill="#10b981" font-weight="700">Ultra Flexible (Fluid)</text>
      </g>

      <rect x="28" y="420" width="504" height="38" rx="4" fill="#0284c7"/>
      <text x="180" y="444" fill="#ffffff" font-size="12" font-weight="700">🔬 Load Specimen A into Lab</text>
    </g>

    <!-- Specimen B: Raw Denim -->
    <g transform="translate(595, 0)">
      <rect width="560" height="480" rx="8" fill="#0d131f" stroke="#10b981" stroke-width="1.5"/>
      <text x="28" y="42" fill="#10b981" font-size="18" font-weight="700">Specimen B: Raw Denim (14oz)</text>
      <text x="28" y="70" fill="#94a3b8" font-size="12">Heavy 14oz twill weave with high bending stiffness and structural crease lines.</text>
      <line x1="28" y1="95" x2="532" y2="95" stroke="#1e293b"/>
      
      <g transform="translate(28, 120)" font-size="12">
        <text x="0" y="20" fill="#64748b">Category</text>
        <text x="350" y="20" fill="#10b981" font-weight="700">Heavy Twill</text>

        <text x="0" y="60" fill="#64748b">Area Density (Mass)</text>
        <text x="350" y="60" fill="#f8fafc" font-weight="700">0.450 kg/m² (+592%)</text>

        <text x="0" y="100" fill="#64748b">Stretch Compliance (α)</text>
        <text x="350" y="100" fill="#f8fafc" font-weight="700">0.00002 m/N (-80%)</text>

        <text x="0" y="140" fill="#64748b">Bending Compliance (α_bend)</text>
        <text x="350" y="140" fill="#f8fafc" font-weight="700">0.650 rad/N (+4233%)</text>

        <text x="0" y="180" fill="#64748b">Internal Damping</text>
        <text x="350" y="180" fill="#f8fafc" font-weight="700">0.050 (+316%)</text>

        <text x="0" y="220" fill="#64748b">Surface Friction</text>
        <text x="350" y="220" fill="#f8fafc" font-weight="700">0.65 (+333%)</text>

        <text x="0" y="260" fill="#64748b">Bending Rigidity Rating</text>
        <text x="350" y="260" fill="#f59e0b" font-weight="700">High Stiffness (Structural)</text>
      </g>

      <rect x="28" y="420" width="504" height="38" rx="4" fill="#059669"/>
      <text x="180" y="444" fill="#ffffff" font-size="12" font-weight="700">🔬 Load Specimen B into Lab</text>
    </g>
  </g>
</svg>