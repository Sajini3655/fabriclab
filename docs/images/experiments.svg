<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#07090e; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1280" height="720" fill="#07090e"/>
  <rect x="0" y="0" width="1280" height="48" fill="#0c101a" stroke="#1e2638" stroke-width="1"/>
  <text x="20" y="30" fill="#ffffff" font-weight="700" font-size="14" letter-spacing="1.5">FABRICLAB</text>
  <text x="120" y="30" fill="#64748b" font-size="11">| Saved Experiments Archive</text>

  <g transform="translate(60, 80)">
    <text x="0" y="20" fill="#f8fafc" font-size="22" font-weight="700">Saved Experiments Archive</text>
    <text x="0" y="44" fill="#94a3b8" font-size="12">Persistent laboratory snapshot library recording material configurations, environmental forces, and physical parameters.</text>
  </g>

  <!-- Search and Actions Bar -->
  <g transform="translate(60, 150)">
    <rect width="360" height="38" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#64748b" font-size="11">🔍 Search experiments by tag or name...</text>

    <rect x="800" y="0" width="160" height="38" rx="6" fill="#1e293b"/>
    <text x="835" y="24" fill="#cbd5e1" font-size="11">📥 Import JSON</text>

    <rect x="980" y="0" width="180" height="38" rx="6" fill="#0284c7"/>
    <text x="1010" y="24" fill="#ffffff" font-size="11" font-weight="700">+ New Snapshot</text>
  </g>

  <!-- Experiment Cards Grid -->
  <g transform="translate(60, 220)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="370" height="260" rx="8" fill="#0d131f" stroke="#38bdf8" stroke-width="1"/>
      <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">Mulberry Silk Wind Aerodynamics</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11">Study of hyper-flexible protein filament fabric subjected to 18 m/s wind drag.</text>
      
      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="56" height="20" rx="3" fill="#1e293b"/>
        <text x="8" y="14" fill="#38bdf8" font-size="10">#Silk</text>
        <rect x="62" y="0" width="56" height="20" rx="3" fill="#1e293b"/>
        <text x="70" y="14" fill="#38bdf8" font-size="10">#Wind</text>
        <rect x="124" y="0" width="80" height="20" rx="3" fill="#1e293b"/>
        <text x="132" y="14" fill="#38bdf8" font-size="10">#Aerodynamics</text>
      </g>

      <line x1="20" y1="150" x2="350" y2="150" stroke="#1e293b"/>
      <text x="20" y="176" fill="#64748b" font-size="11">Material: <tspan fill="#f8fafc">Mulberry Silk</tspan></text>
      <text x="20" y="196" fill="#64748b" font-size="11">Resolution: <tspan fill="#f8fafc">70x70 (5,041 particles)</tspan></text>

      <rect x="20" y="212" width="220" height="32" rx="4" fill="#0284c7"/>
      <text x="70" y="232" fill="#ffffff" font-size="11" font-weight="700">🔬 Load into Lab</text>
      <rect x="250" y="212" width="100" height="32" rx="4" fill="#1e293b"/>
      <text x="270" y="232" fill="#94a3b8" font-size="11">📑 Duplicate</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(395, 0)">
      <rect width="370" height="260" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">Heavy Denim Lunar Gravity</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11">Observation of 14oz twill weave structural rigidity under 1.62 m/s² lunar gravity.</text>
      
      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="60" height="20" rx="3" fill="#1e293b"/>
        <text x="8" y="14" fill="#38bdf8" font-size="10">#Denim</text>
        <rect x="66" y="0" width="56" height="20" rx="3" fill="#1e293b"/>
        <text x="74" y="14" fill="#38bdf8" font-size="10">#Moon</text>
        <rect x="128" y="0" width="75" height="20" rx="3" fill="#1e293b"/>
        <text x="136" y="14" fill="#38bdf8" font-size="10">#Structural</text>
      </g>

      <line x1="20" y1="150" x2="350" y2="150" stroke="#1e293b"/>
      <text x="20" y="176" fill="#64748b" font-size="11">Material: <tspan fill="#f8fafc">Raw Denim</tspan></text>
      <text x="20" y="196" fill="#64748b" font-size="11">Resolution: <tspan fill="#f8fafc">60x60 (3,721 particles)</tspan></text>

      <rect x="20" y="212" width="220" height="32" rx="4" fill="#1e293b"/>
      <text x="70" y="232" fill="#94a3b8" font-size="11">🔬 Load into Lab</text>
      <rect x="250" y="212" width="100" height="32" rx="4" fill="#1e293b"/>
      <text x="270" y="232" fill="#94a3b8" font-size="11">📑 Duplicate</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(790, 0)">
      <rect width="370" height="260" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">Latex Rubber Sphere Collision</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11">Isotropic rubber membrane draped over a 2.4m rigid collider sphere to evaluate friction.</text>
      
      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="60" height="20" rx="3" fill="#1e293b"/>
        <text x="8" y="14" fill="#38bdf8" font-size="10">#Rubber</text>
        <rect x="66" y="0" width="75" height="20" rx="3" fill="#1e293b"/>
        <text x="74" y="14" fill="#38bdf8" font-size="10">#Collision</text>
        <rect x="147" y="0" width="75" height="20" rx="3" fill="#1e293b"/>
        <text x="155" y="14" fill="#38bdf8" font-size="10">#Elastomer</text>
      </g>

      <line x1="20" y1="150" x2="350" y2="150" stroke="#1e293b"/>
      <text x="20" y="176" fill="#64748b" font-size="11">Material: <tspan fill="#f8fafc">Natural Latex</tspan></text>
      <text x="20" y="196" fill="#64748b" font-size="11">Resolution: <tspan fill="#f8fafc">65x65 (4,356 particles)</tspan></text>

      <rect x="20" y="212" width="220" height="32" rx="4" fill="#1e293b"/>
      <text x="70" y="232" fill="#94a3b8" font-size="11">🔬 Load into Lab</text>
      <rect x="250" y="212" width="100" height="32" rx="4" fill="#1e293b"/>
      <text x="270" y="232" fill="#94a3b8" font-size="11">📑 Duplicate</text>
    </g>
  </g>
</svg>