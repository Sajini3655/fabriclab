<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#07090e; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sparklineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Subtle Perspective Grid Floor -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="0.8">
    <line x1="240" y1="640" x2="1040" y2="640"/>
    <line x1="280" y1="600" x2="1000" y2="600"/>
    <line x1="320" y1="560" x2="960" y2="560"/>
    <line x1="360" y1="520" x2="920" y2="520"/>
    <line x1="400" y1="480" x2="880" y2="480"/>
    <line x1="360" y1="660" x2="520" y2="460"/>
    <line x1="500" y1="660" x2="580" y2="460"/>
    <line x1="640" y1="660" x2="640" y2="460"/>
    <line x1="780" y1="660" x2="700" y2="460"/>
    <line x1="920" y1="660" x2="760" y2="460"/>
  </g>

  <!-- 3D Cloth Simulation Mesh Visualization -->
  <!-- Top Anchor Bar -->
  <line x1="460" y1="180" x2="820" y2="180" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="460" cy="180" r="4.5" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="505" cy="180" r="3.5" fill="#f43f5e"/>
  <circle cx="550" cy="180" r="3.5" fill="#f43f5e"/>
  <circle cx="595" cy="180" r="3.5" fill="#f43f5e"/>
  <circle cx="640" cy="180" r="3.5" fill="#f43f5e"/>
  <circle cx="685" cy="180" r="3.5" fill="#f43f5e"/>
  <circle cx="730" cy="180" r="3.5" fill="#f43f5e"/>
  <circle cx="775" cy="180" r="3.5" fill="#f43f5e"/>
  <circle cx="820" cy="180" r="4.5" fill="#f43f5e" filter="url(#glow)"/>

  <!-- Shaded Cloth Surface Folds -->
  <path d="M 460,180 Q 520,240 500,340 T 470,470 Q 550,490 640,460 T 810,480 Q 780,350 760,240 T 820,180 Z" fill="url(#clothGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)"/>
  
  <!-- Catenary Internal Folds and Wrinkles -->
  <path d="M 460,180 Q 540,290 530,410 Q 580,440 640,460 Q 700,440 750,410 Q 740,290 820,180" fill="none" stroke="#7dd3fc" stroke-width="1.4" opacity="0.7"/>
  <path d="M 505,180 Q 560,280 570,420 Q 605,445 640,460 Q 675,445 710,420 Q 720,280 775,180" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.5"/>
  <path d="M 550,180 Q 590,270 600,430 Q 620,450 640,460 Q 660,450 680,430 Q 690,270 730,180" fill="none" stroke="#e0f2fe" stroke-width="1.0" opacity="0.4"/>

  <!-- Wireframe Lattice Lines -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.3">
    <!-- Horizontal Cross Sections -->
    <path d="M 475,230 Q 550,260 640,260 Q 730,260 805,230" fill="none"/>
    <path d="M 490,290 Q 560,330 640,330 Q 720,330 790,290" fill="none"/>
    <path d="M 495,360 Q 565,400 640,405 Q 715,400 785,360" fill="none"/>
    <path d="M 480,420 Q 555,450 640,455 Q 725,450 800,420" fill="none"/>
    <!-- Vertical Strands -->
    <path d="M 480,180 Q 500,320 480,450" fill="none"/>
    <path d="M 530,180 Q 545,330 540,460" fill="none"/>
    <path d="M 580,180 Q 595,330 600,460" fill="none"/>
    <path d="M 640,180 Q 640,330 640,460" fill="none"/>
    <path d="M 700,180 Q 685,330 680,460" fill="none"/>
    <path d="M 750,180 Q 735,330 740,460" fill="none"/>
    <path d="M 800,180 Q 780,320 800,450" fill="none"/>
  </g>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1280" height="48" fill="#0c101a" stroke="#1e2638" stroke-width="1"/>
  <g transform="translate(20, 15)">
    <rect x="0" y="2" width="16" height="16" rx="3" fill="#38bdf8"/>
    <text x="24" y="15" fill="#ffffff" font-weight="700" font-size="14" letter-spacing="1.5">FABRICLAB</text>
    <text x="120" y="15" fill="#64748b" font-size="11">| WebGPU XPBD Lab</text>
  </g>

  <!-- Navigation Links -->
  <g transform="translate(360, 16)" font-size="11" font-weight="600">
    <rect x="-8" y="-6" width="68" height="24" rx="4" fill="#1e293b"/>
    <text x="0" y="10" fill="#38bdf8">LAB</text>
    <text x="75" y="10" fill="#94a3b8">MATERIALS</text>
    <text x="170" y="10" fill="#94a3b8">COMPARE</text>
    <text x="255" y="10" fill="#94a3b8">EXPERIMENTS</text>
    <text x="365" y="10" fill="#94a3b8">BENCHMARK</text>
    <text x="470" y="10" fill="#94a3b8">ABOUT</text>
  </g>

  <g transform="translate(1120, 14)">
    <rect x="0" y="0" width="140" height="22" rx="4" fill="#161e2e" stroke="#2a364f" stroke-width="1"/>
    <text x="14" y="14" fill="#94a3b8" font-size="10">⌘K Quick Launch</text>
  </g>

  <!-- Viewport Floating Overlay Controls -->
  <g transform="translate(430, 64)">
    <rect x="0" y="0" width="420" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.95"/>
    <rect x="6" y="5" width="60" height="24" rx="4" fill="#0284c7"/>
    <text x="20" y="21" fill="#ffffff" font-size="10" font-weight="700">Shaded</text>
    <text x="80" y="21" fill="#94a3b8" font-size="10">Normals</text>
    <text x="140" y="21" fill="#94a3b8" font-size="10">Wireframe</text>
    <text x="210" y="21" fill="#f59e0b" font-size="10">🔥 Stress View</text>
    <line x1="290" y1="6" x2="290" y2="28" stroke="#334155" stroke-width="1"/>
    <text x="305" y="21" fill="#38bdf8" font-size="10">🎥 Orbit</text>
    <text x="360" y="21" fill="#94a3b8" font-size="10">✋ Grab</text>
  </g>

  <!-- Left Dock: Controls -->
  <rect x="16" y="64" width="220" height="600" rx="8" fill="#0c121e" stroke="#1e293b" stroke-width="1" opacity="0.95"/>
  <text x="32" y="92" fill="#f8fafc" font-weight="700" font-size="12">Laboratory Controls</text>
  
  <g transform="translate(32, 108)">
    <rect x="0" y="0" width="58" height="20" rx="3" fill="#0284c7"/>
    <text x="8" y="14" fill="#ffffff" font-size="10" font-weight="700">Materials</text>
    <rect x="64" y="0" width="58" height="20" rx="3" fill="#1e293b"/>
    <text x="76" y="14" fill="#94a3b8" font-size="10">Physics</text>
    <rect x="128" y="0" width="58" height="20" rx="3" fill="#1e293b"/>
    <text x="148" y="14" fill="#94a3b8" font-size="10">Env</text>
  </g>

  <!-- Material Cards in Dock -->
  <g transform="translate(32, 142)">
    <rect x="0" y="0" width="188" height="42" rx="4" fill="#162032" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="16" cy="21" r="5" fill="#38bdf8"/>
    <text x="30" y="18" fill="#ffffff" font-size="11" font-weight="700">Mulberry Silk</text>
    <text x="30" y="32" fill="#64748b" font-size="9">Natural Filament • 0.065 kg/m²</text>

    <rect x="0" y="48" width="188" height="38" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="16" cy="67" r="5" fill="#e2e8f0"/>
    <text x="30" y="65" fill="#cbd5e1" font-size="11">Organic Cotton</text>
    <text x="30" y="78" fill="#64748b" font-size="9">Staple Fiber • 0.180 kg/m²</text>

    <rect x="0" y="92" width="188" height="38" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="16" cy="111" r="5" fill="#2563eb"/>
    <text x="30" y="109" fill="#cbd5e1" font-size="11">Raw Denim (14oz)</text>
    <text x="30" y="122" fill="#64748b" font-size="9">Heavy Twill • 0.450 kg/m²</text>

    <rect x="0" y="136" width="188" height="38" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="16" cy="155" r="5" fill="#cbd5e1"/>
    <text x="30" y="153" fill="#cbd5e1" font-size="11">Belgian Linen</text>
    <text x="30" y="166" fill="#64748b" font-size="9">Bast Fiber • 0.230 kg/m²</text>
  </g>

  <!-- XPBD Parameters in Left Dock -->
  <g transform="translate(32, 335)">
    <text x="0" y="0" fill="#94a3b8" font-size="10" font-weight="700">XPBD SOLVER PARAMETERS</text>
    
    <text x="0" y="24" fill="#cbd5e1" font-size="10">Sub-Steps / Frame</text>
    <text x="165" y="24" fill="#38bdf8" font-size="10" font-weight="700">12</text>
    <rect x="0" y="32" width="188" height="4" rx="2" fill="#1e293b"/>
    <rect x="0" y="32" width="75" height="4" rx="2" fill="#38bdf8"/>

    <text x="0" y="56" fill="#cbd5e1" font-size="10">Grid Divisions</text>
    <text x="145" y="56" fill="#38bdf8" font-size="10" font-weight="700">60x60</text>
    <rect x="0" y="64" width="188" height="4" rx="2" fill="#1e293b"/>
    <rect x="0" y="64" width="90" height="4" rx="2" fill="#38bdf8"/>

    <text x="0" y="88" fill="#cbd5e1" font-size="10">Pinning Mode</text>
    <rect x="0" y="96" width="58" height="20" rx="3" fill="#0284c7"/>
    <text x="8" y="110" fill="#ffffff" font-size="9" font-weight="700">Top Edge</text>
    <rect x="64" y="96" width="58" height="20" rx="3" fill="#1e293b"/>
    <text x="74" y="110" fill="#94a3b8" font-size="9">2 Corners</text>
    <rect x="128" y="96" width="58" height="20" rx="3" fill="#1e293b"/>
    <text x="146" y="110" fill="#94a3b8" font-size="9">Free</text>
  </g>

  <!-- Right Dock: Live Telemetry -->
  <rect x="1044" y="64" width="220" height="600" rx="8" fill="#0c121e" stroke="#1e293b" stroke-width="1" opacity="0.95"/>
  <text x="1060" y="92" fill="#f8fafc" font-weight="700" font-size="12">Telemetry & Profiling</text>

  <!-- Metric Tiles -->
  <g transform="translate(1060, 108)">
    <rect x="0" y="0" width="90" height="52" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="8" y="18" fill="#64748b" font-size="9">FRAME RATE</text>
    <text x="8" y="42" fill="#10b981" font-size="16" font-weight="700">107 FPS</text>

    <rect x="98" y="0" width="90" height="52" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="106" y="18" fill="#64748b" font-size="9">FRAME TIME</text>
    <text x="106" y="42" fill="#38bdf8" font-size="16" font-weight="700">9.3 ms</text>

    <rect x="0" y="60" width="90" height="52" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="8" y="78" fill="#64748b" font-size="9">PARTICLES</text>
    <text x="8" y="102" fill="#f8fafc" font-size="15" font-weight="700">3,721</text>

    <rect x="98" y="60" width="90" height="52" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="106" y="78" fill="#64748b" font-size="9">CONSTRAINTS</text>
    <text x="106" y="102" fill="#f8fafc" font-size="15" font-weight="700">21,600</text>
  </g>

  <!-- Rolling Sparkline Graph -->
  <g transform="translate(1060, 240)">
    <text x="0" y="0" fill="#94a3b8" font-size="10" font-weight="700">FRAME LATENCY HISTORY</text>
    <rect x="0" y="10" width="188" height="60" rx="4" fill="#080d14" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Sparkline Area & Path -->
    <path d="M 5,55 L 20,52 L 40,48 L 60,51 L 80,45 L 100,47 L 120,44 L 140,46 L 160,43 L 183,44 L 183,68 L 5,68 Z" fill="url(#sparklineGrad)"/>
    <path d="M 5,55 L 20,52 L 40,48 L 60,51 L 80,45 L 100,47 L 120,44 L 140,46 L 160,43 L 183,44" fill="none" stroke="#10b981" stroke-width="1.8"/>
  </g>

  <!-- Material Specimen Inspector in Right Dock -->
  <g transform="translate(1060, 335)">
    <line x1="0" y1="0" x2="188" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="20" fill="#38bdf8" font-size="11" font-weight="700">Specimen Analysis</text>
    
    <text x="0" y="44" fill="#64748b" font-size="10">Density:</text>
    <text x="120" y="44" fill="#cbd5e1" font-size="10">0.065 kg/m²</text>
    
    <text x="0" y="64" fill="#64748b" font-size="10">Stretch Compliance:</text>
    <text x="145" y="64" fill="#cbd5e1" font-size="10">0.0001</text>
    
    <text x="0" y="84" fill="#64748b" font-size="10">Bending Compliance:</text>
    <text x="155" y="84" fill="#cbd5e1" font-size="10">0.015</text>

    <text x="0" y="104" fill="#64748b" font-size="10">Internal Damping:</text>
    <text x="155" y="104" fill="#cbd5e1" font-size="10">0.012</text>
  </g>

  <!-- Bottom Floating Simulation Control Bar -->
  <g transform="translate(420, 664)">
    <rect x="0" y="0" width="440" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.95"/>
    <rect x="10" y="7" width="70" height="24" rx="4" fill="#10b981"/>
    <text x="24" y="23" fill="#ffffff" font-size="10" font-weight="700">▶ Resume</text>
    <text x="95" y="23" fill="#94a3b8" font-size="10">⏭ Step</text>
    <text x="145" y="23" fill="#94a3b8" font-size="10">↺ Reset</text>
    <text x="195" y="23" fill="#38bdf8" font-size="10">Speed: 1.0x</text>
    <line x1="265" y1="8" x2="265" y2="30" stroke="#334155" stroke-width="1"/>
    <text x="280" y="23" fill="#94a3b8" font-size="10">📷 Camera</text>
    <text x="345" y="23" fill="#38bdf8" font-size="10">💾 Save Experiment</text>
  </g>
</svg>