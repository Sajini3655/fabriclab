<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#07090e; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1280" height="720" fill="#07090e"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1280" height="48" fill="#0c101a" stroke="#1e2638" stroke-width="1"/>
  <text x="20" y="30" fill="#ffffff" font-weight="700" font-size="14" letter-spacing="1.5">FABRICLAB</text>
  <text x="120" y="30" fill="#64748b" font-size="11">| Material Specimen Library</text>

  <g transform="translate(60, 80)">
    <text x="0" y="20" fill="#f8fafc" font-size="22" font-weight="700">Material Specimen Catalog</text>
    <text x="0" y="44" fill="#94a3b8" font-size="12">8 parameterized textile specimens calibrated with area mass, elastic compliance, and damping coefficients.</text>
  </g>

  <!-- 8 Specimen Cards Grid (2 rows of 4) -->
  <g transform="translate(60, 150)">
    <!-- Silk -->
    <g transform="translate(0, 0)">
      <rect width="270" height="240" rx="8" fill="#0d131f" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="10" fill="#38bdf8"/>
      <text x="48" y="32" fill="#ffffff" font-size="14" font-weight="700">Mulberry Silk</text>
      <text x="20" y="60" fill="#94a3b8" font-size="10">Natural Protein Filament</text>
      <text x="20" y="80" fill="#64748b" font-size="10">Extremely fluid, light drape with soft specular highlights.</text>
      <line x1="20" y1="100" x2="250" y2="100" stroke="#1e293b"/>
      <text x="20" y="125" fill="#64748b" font-size="10">Area Density: <tspan fill="#38bdf8">0.065 kg/m²</tspan></text>
      <text x="20" y="145" fill="#64748b" font-size="10">Bend Compliance: <tspan fill="#38bdf8">0.015 rad/N</tspan></text>
      <text x="20" y="165" fill="#64748b" font-size="10">Stretch Compliance: <tspan fill="#38bdf8">0.0001 m/N</tspan></text>
      <rect x="20" y="185" width="230" height="34" rx="4" fill="#0284c7"/>
      <text x="75" y="206" fill="#ffffff" font-size="11" font-weight="700">🔬 Simulate in Lab</text>
    </g>

    <!-- Cotton -->
    <g transform="translate(295, 0)">
      <rect width="270" height="240" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="10" fill="#e2e8f0"/>
      <text x="48" y="32" fill="#ffffff" font-size="14" font-weight="700">Organic Cotton</text>
      <text x="20" y="60" fill="#94a3b8" font-size="10">Natural Staple Fiber</text>
      <text x="20" y="80" fill="#64748b" font-size="10">Balanced plain weave with moderate structural creasing.</text>
      <line x1="20" y1="100" x2="250" y2="100" stroke="#1e293b"/>
      <text x="20" y="125" fill="#64748b" font-size="10">Area Density: <tspan fill="#cbd5e1">0.180 kg/m²</tspan></text>
      <text x="20" y="145" fill="#64748b" font-size="10">Bend Compliance: <tspan fill="#cbd5e1">0.120 rad/N</tspan></text>
      <text x="20" y="165" fill="#64748b" font-size="10">Stretch Compliance: <tspan fill="#cbd5e1">0.0005 m/N</tspan></text>
      <rect x="20" y="185" width="230" height="34" rx="4" fill="#1e293b"/>
      <text x="75" y="206" fill="#94a3b8" font-size="11">🔬 Simulate in Lab</text>
    </g>

    <!-- Denim -->
    <g transform="translate(590, 0)">
      <rect width="270" height="240" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="10" fill="#2563eb"/>
      <text x="48" y="32" fill="#ffffff" font-size="14" font-weight="700">Raw Denim (14oz)</text>
      <text x="20" y="60" fill="#94a3b8" font-size="10">Heavy Twill Weave</text>
      <text x="20" y="80" fill="#64748b" font-size="10">High bending stiffness with heavy structural folds.</text>
      <line x1="20" y1="100" x2="250" y2="100" stroke="#1e293b"/>
      <text x="20" y="125" fill="#64748b" font-size="10">Area Density: <tspan fill="#cbd5e1">0.450 kg/m²</tspan></text>
      <text x="20" y="145" fill="#64748b" font-size="10">Bend Compliance: <tspan fill="#cbd5e1">0.650 rad/N</tspan></text>
      <text x="20" y="165" fill="#64748b" font-size="10">Stretch Compliance: <tspan fill="#cbd5e1">0.00002 m/N</tspan></text>
      <rect x="20" y="185" width="230" height="34" rx="4" fill="#1e293b"/>
      <text x="75" y="206" fill="#94a3b8" font-size="11">🔬 Simulate in Lab</text>
    </g>

    <!-- Linen -->
    <g transform="translate(885, 0)">
      <rect width="270" height="240" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="10" fill="#d1d5db"/>
      <text x="48" y="32" fill="#ffffff" font-size="14" font-weight="700">Belgian Linen</text>
      <text x="20" y="60" fill="#94a3b8" font-size="10">Natural Bast Fiber</text>
      <text x="20" y="80" fill="#64748b" font-size="10">Crisp, structured drape with natural creasing.</text>
      <line x1="20" y1="100" x2="250" y2="100" stroke="#1e293b"/>
      <text x="20" y="125" fill="#64748b" font-size="10">Area Density: <tspan fill="#cbd5e1">0.230 kg/m²</tspan></text>
      <text x="20" y="145" fill="#64748b" font-size="10">Bend Compliance: <tspan fill="#cbd5e1">0.380 rad/N</tspan></text>
      <text x="20" y="165" fill="#64748b" font-size="10">Stretch Compliance: <tspan fill="#cbd5e1">0.00008 m/N</tspan></text>
      <rect x="20" y="185" width="230" height="34" rx="4" fill="#1e293b"/>
      <text x="75" y="206" fill="#94a3b8" font-size="11">🔬 Simulate in Lab</text>
    </g>

    <!-- Leather -->
    <g transform="translate(0, 260)">
      <rect width="270" height="240" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="10" fill="#78350f"/>
      <text x="48" y="32" fill="#ffffff" font-size="14" font-weight="700">Tanned Calfskin</text>
      <text x="20" y="60" fill="#94a3b8" font-size="10">Full-Grain Leather</text>
      <text x="20" y="80" fill="#64748b" font-size="10">Heavy, nearly inextensible material with thick folds.</text>
      <line x1="20" y1="100" x2="250" y2="100" stroke="#1e293b"/>
      <text x="20" y="125" fill="#64748b" font-size="10">Area Density: <tspan fill="#cbd5e1">0.780 kg/m²</tspan></text>
      <text x="20" y="145" fill="#64748b" font-size="10">Bend Compliance: <tspan fill="#cbd5e1">0.880 rad/N</tspan></text>
      <text x="20" y="165" fill="#64748b" font-size="10">Stretch Compliance: <tspan fill="#cbd5e1">0.00001 m/N</tspan></text>
      <rect x="20" y="185" width="230" height="34" rx="4" fill="#1e293b"/>
      <text x="75" y="206" fill="#94a3b8" font-size="11">🔬 Simulate in Lab</text>
    </g>

    <!-- Rubber -->
    <g transform="translate(295, 260)">
      <rect width="270" height="240" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="10" fill="#1e293b"/>
      <text x="48" y="32" fill="#ffffff" font-size="14" font-weight="700">Natural Latex Rubber</text>
      <text x="20" y="60" fill="#94a3b8" font-size="10">Elastomer Membrane</text>
      <text x="20" y="80" fill="#64748b" font-size="10">High tensile stretch with glossy reflection and high friction.</text>
      <line x1="20" y1="100" x2="250" y2="100" stroke="#1e293b"/>
      <text x="20" y="125" fill="#64748b" font-size="10">Area Density: <tspan fill="#cbd5e1">0.850 kg/m²</tspan></text>
      <text x="20" y="145" fill="#64748b" font-size="10">Bend Compliance: <tspan fill="#cbd5e1">0.060 rad/N</tspan></text>
      <text x="20" y="165" fill="#64748b" font-size="10">Stretch Compliance: <tspan fill="#cbd5e1">0.04500 m/N</tspan></text>
      <rect x="20" y="185" width="230" height="34" rx="4" fill="#1e293b"/>
      <text x="75" y="206" fill="#94a3b8" font-size="11">🔬 Simulate in Lab</text>
    </g>

    <!-- Wool -->
    <g transform="translate(590, 260)">
      <rect width="270" height="240" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="10" fill="#831843"/>
      <text x="48" y="32" fill="#ffffff" font-size="14" font-weight="700">Merino Flannel Wool</text>
      <text x="20" y="60" fill="#94a3b8" font-size="10">Brushed Protein Fiber</text>
      <text x="20" y="80" fill="#64748b" font-size="10">Soft matte drape with high internal damping.</text>
      <line x1="20" y1="100" x2="250" y2="100" stroke="#1e293b"/>
      <text x="20" y="125" fill="#64748b" font-size="10">Area Density: <tspan fill="#cbd5e1">0.360 kg/m²</tspan></text>
      <text x="20" y="145" fill="#64748b" font-size="10">Bend Compliance: <tspan fill="#cbd5e1">0.180 rad/N</tspan></text>
      <text x="20" y="165" fill="#64748b" font-size="10">Stretch Compliance: <tspan fill="#cbd5e1">0.00200 m/N</tspan></text>
      <rect x="20" y="185" width="230" height="34" rx="4" fill="#1e293b"/>
      <text x="75" y="206" fill="#94a3b8" font-size="11">🔬 Simulate in Lab</text>
    </g>

    <!-- Canvas -->
    <g transform="translate(885, 260)">
      <rect width="270" height="240" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="10" fill="#d97706"/>
      <text x="48" y="32" fill="#ffffff" font-size="14" font-weight="700">Sailcloth Duck Canvas</text>
      <text x="20" y="60" fill="#94a3b8" font-size="10">Technical Heavy Duck</text>
      <text x="20" y="80" fill="#64748b" font-size="10">High tensile stability with rigid resistance to creasing.</text>
      <line x1="20" y1="100" x2="250" y2="100" stroke="#1e293b"/>
      <text x="20" y="125" fill="#64748b" font-size="10">Area Density: <tspan fill="#cbd5e1">0.540 kg/m²</tspan></text>
      <text x="20" y="145" fill="#64748b" font-size="10">Bend Compliance: <tspan fill="#cbd5e1">0.720 rad/N</tspan></text>
      <text x="20" y="165" fill="#64748b" font-size="10">Stretch Compliance: <tspan fill="#cbd5e1">0.00003 m/N</tspan></text>
      <rect x="20" y="185" width="230" height="34" rx="4" fill="#1e293b"/>
      <text x="75" y="206" fill="#94a3b8" font-size="11">🔬 Simulate in Lab</text>
    </g>
  </g>
</svg>